<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/styles.css"><title>POS Plasita · Sincronización</title></head><body data-page="sync"><main id="main" data-title="Sincronización">
<div class="banner" id="sBanner" hidden>Sin conexión: stock no garantizado. Las ventas se guardan localmente hasta la próxima sincronización.</div>
<section class="card"><div class="row"><div><span class="muted">Caja seleccionada</span><h2 id="sCaja"></h2><p class="muted" id="sUlt"></p></div><label class="muted"><input type="checkbox" id="sOff"> Simular sin conexión</label></div></section>
<section class="kpi4" style="margin-top:12px"><div class="card"><span class="muted">Ventas pendientes</span><p class="big o" id="sPend">0</p></div><div class="card"><span class="muted">Conexión</span><p class="big" id="sCon"></p></div><div class="card"><span class="muted">Envío actual</span><p class="big" id="sEnv" style="color:var(--blue)"></p></div><div class="card"><span class="muted">Último estado</span><p class="big" id="sEst"></p></div></section>
<section class="card" style="overflow-x:auto"><table><thead><tr><th>Estado</th><th>Descripción</th><th>Detalles</th><th>Reintento</th></tr></thead><tbody id="sRows"></tbody></table></section>
<div class="acts" style="margin-top:12px"><button class="btn primary" id="sBtn">Reintentar conexión</button><button class="btn" onclick="location.href='conflictos.html'">Revisar conflictos</button></div></main>
<div class="toast" id="toast"></div><script src="js/app.js"></script></body></html>
