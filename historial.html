<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/styles.css"><title>POS Plasita · Historial</title></head><body data-page="historial"><main id="main" data-title="Historial de ventas">
<section class="kpi4"><div class="card"><span class="muted">Total operaciones</span><p id="hOps">0</p></div><div class="card"><span class="muted">Total importe</span><p id="hImp">S/0.00</p></div><div class="card"><span class="muted">Sincronizado</span><p id="hSync" style="color:var(--green)">0</p></div><div class="card"><span class="muted">Pendiente</span><p id="hPend" style="color:#c2410c">0</p></div></section>
<section class="card"><h3>Filtros</h3><div class="filters"><input type="date" id="fFecha" aria-label="Fecha"><select id="fCaja" aria-label="Caja"><option value="">Todas las cajas</option><option>Caja 1</option><option>Caja 2</option><option>Caja 3</option></select><select id="fEst" aria-label="Estado"><option value="">Todos los estados</option><option value="s">Sincronizado</option><option value="p">Pendiente</option></select></div></section>
<section class="card" style="margin-top:12px;overflow-x:auto"><table><thead><tr><th>N° operación</th><th>Fecha / hora</th><th>Caja</th><th>Cajero</th><th>Importe</th><th>Método</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="hRows"></tbody></table><p class="muted" id="hFoot" style="margin-top:10px"></p></section></main>
<div class="toast" id="toast"></div><script src="js/app.js"></script></body></html>
