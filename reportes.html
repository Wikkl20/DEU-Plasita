<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/styles.css"><title>POS Plasita · Reportes</title></head><body data-page="reportes"><main id="main" data-title="Reportes">
<section class="card"><h3>Filtros</h3><div class="filters"><input type="date" id="rFecha" aria-label="Fecha"><select id="rPer" aria-label="Período"><option>Diario</option><option>Semanal</option><option>Mensual</option></select><select id="rCaja" aria-label="Caja"><option>Caja 1</option><option>Caja 2</option><option>Caja 3</option></select><input id="rUser" aria-label="Usuario" readonly></div></section>
<section class="card" style="margin-top:12px"><h3>Resumen diario</h3><div class="mgrid"><div class="box"><span class="muted">Ventas del día</span><b id="rV" class="blue">S/0.00</b></div><div class="box"><span class="muted">Transacciones</span><b id="rT" class="blue">0</b></div><div class="box"><span class="muted">Productos vendidos</span><b id="rP" class="blue">0</b></div></div>
<div class="row"><p id="rTxt" class="muted"></p><button class="btn primary" id="rBtn">Ver reporte diario</button></div></section></main>
<div class="toast" id="toast"></div><script src="js/app.js"></script></body></html>
