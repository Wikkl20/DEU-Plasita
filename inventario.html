<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/styles.css"><title>POS Plasita · Inventario</title></head><body data-page="inventario"><main id="main" data-title="Inventario">
<div class="page-head"><div><h2>Inventario de productos</h2><p class="muted" id="iSub"></p></div><div class="acts"><button class="btn" id="iRep">Ver reporte diario</button><button class="btn" id="iNew">Nuevo producto</button></div></div>
<div class="toolbar"><input id="iQ" placeholder="Buscar por producto o código"><select id="iCat"><option value="">Categoría</option></select><select id="iEst"><option value="">Estado</option><option value="ok">Disponible</option><option value="bajo">Bajo stock</option></select><button class="btn primary" id="iSync">Sincronizar</button></div>
<section class="card" style="overflow-x:auto"><table><thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="iRows"></tbody></table>
<div class="pager"><span class="muted" id="iPag"></span><div class="acts"><button class="btn" id="iPrev">Anterior</button><button class="btn" id="iNext">Siguiente</button></div></div></section>
<div class="banner" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px"><span><b>Stock bajo</b><br><span id="iLow"></span></span><button class="btn" id="iVer">Ver lista</button></div></main>
<div class="toast" id="toast"></div><script src="js/app.js"></script></body></html>
